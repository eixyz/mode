  # Contact details, opening hours and closure days, shown in the header,
  # footer, contact page, legal pages and appointment calendar.
  - name: site_settings
    label: Embassy Settings
    format: json
    editor: { preview: false }
    files:
      - name: contact
        label: "Contact details"
        file: content/settings/contact.json
        fields:
          - { name: phone, label: Telephone, widget: string, required: true, hint: "International format, e.g. +49 30 3987 6500" }
          - { name: fax, label: Fax, widget: string, required: false }
          - { name: email, label: Public email address, widget: string, required: true, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Please enter a valid email address"] }
          - { name: street, label: Street and number, widget: string, required: true }
          - { name: postalCode, label: Postal code, widget: string, required: true, pattern: ['^\d{5}$', "German postal codes have five digits"] }
      - name: closures
        label: "Closure days (no appointments)"
        file: content/settings/closures.json
        fields:
          - name: dates
            label: Closure days
            label_singular: closure day
            widget: list
            summary: "{{fields.date}} {{fields.note}}"
            hint: "Days on which the Embassy is closed. These dates cannot be chosen in the appointment calendar. Past dates can be removed."
            fields:
              - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { name: note, label: Reason, widget: string, required: false, hint: "For staff reference only, not shown on the website. e.g. Independence Day" }
      - name: hours_en
        label: "Opening hours — English"
        file: content/settings/hours.en.json
        fields: &hours_fields
          - { name: summaryLine1, label: "Footer line 1", widget: string, required: true, hint: "Short, e.g. Mon - Fri: 09:00 - 16:30" }
          - { name: summaryLine2, label: "Footer line 2", widget: string, required: true, hint: "Short, e.g. Consular: 09:30 - 15:00" }
          - { name: lines, label: "Contact page lines", label_singular: line, widget: list, field: { name: line, label: Line, widget: string } }
      - name: hours_de
        label: "Opening hours — Deutsch"
        file: content/settings/hours.de.json
        fields: *hours_fields
      - name: hours_pt
        label: "Opening hours — Português"
        file: content/settings/hours.pt.json
        fields: *hours_fields
