# Decap CMS configuration
# NOTE: Fill in your GitHub repo details and configure a GitHub OAuth app
# (via a Netlify-compatible OAuth provider, e.g. https://github.com/vencax/netlify-cms-github-oauth-provider
# hosted separately) then set `base_url` below. Secrets must NOT be committed.

backend:
  name: github
  repo: eixyz/mode # TODO: replace with GitHub owner/repo, e.g. mozambique-embassy/website
  branch: main
  # OAuth flow — the client_id is public, but the client_secret lives on your
  # OAuth proxy server (never in this file).
  base_url: https://sveltia-cms-auth.mozemb.workers.dev # TODO
  auth_endpoint: /auth

# Where uploaded images go in the repo, and how they're served by the site.
media_folder: "public/uploads"
public_folder: "/uploads"

# Show a "Publish" workflow with drafts / review before merging.
publish_mode: editorial_workflow

site_url: https://mozambique-embassy.de # TODO: production URL
display_url: https://mozambique-embassy.de # TODO
logo_url: /favicon.ico

# Local testing: run `npm run cms` next to `npm run dev`, then open
# http://localhost:8080/admin/ — edits are written to your local files and no
# GitHub sign-in is needed. Ignored on the live site.
local_backend: true

# News and events can be written in English, German and Portuguese.
# Each language is saved as its own file (slug.en.md, slug.de.md, slug.pt.md).
# English is required; an empty German or Portuguese version shows the English text.
i18n:
  structure: multiple_files
  locales: [en, de, pt]
  default_locale: en

collections:
  - name: news
    label: News & Announcements
    folder: "content/news"
    create: true
    i18n: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: [date, title]
    extension: md
    format: frontmatter
    fields:
      # Shared fields (no i18n) are entered once, in the English tab.
      - { name: id, label: ID (slug), widget: string, hint: "Stable web address, e.g. new-consular-hours. Lowercase letters, numbers and hyphens. Do not change after publishing." }
      - { name: date, label: Publish date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: category, label: Category, widget: select, options: [Announcement, Press Release, Consular, Cultural, Trade, Event] }
      - { name: image, label: Cover image, widget: image, required: false, hint: "Landscape photo, at least 1200 px wide. Only use photos the Embassy may publish." }
      # Translatable fields. "required: false" lets you save before translating;
      # the automatic check refuses an English entry without a title.
      - { name: title, label: Title, widget: string, i18n: true, required: false, hint: "Required in English. Leave empty in German/Portuguese to show the English version." }
      - { name: displayDate, label: Display date (optional), widget: string, i18n: true, required: false, hint: "Leave empty to show the publish date automatically in each language." }
      - { name: excerpt, label: Short excerpt, widget: text, i18n: true, required: false, hint: "One or two sentences shown in the news list." }
      - { name: body, label: Body, widget: markdown, i18n: true, required: false }

  - name: events
    label: Events
    folder: "content/events"
    create: true
    i18n: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: [date, title]
    extension: md
    format: frontmatter
    fields:
      # Shared fields (no i18n) are entered once, in the English tab.
      - { name: id, label: ID (slug), widget: string, hint: "Stable web address, e.g. independence-day-reception. Lowercase letters, numbers and hyphens." }
      - { name: date, label: Event date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: time, label: Time, widget: string, hint: "e.g. 18:00 – 20:00" }
      - { name: category, label: Category, widget: select, options: [Cultural, Diplomatic, Trade, Public, Commemoration] }
      - { name: featured, label: Featured on homepage, widget: boolean, default: false, required: false }
      - { name: image, label: Cover image, widget: image, required: false }
      # Translatable fields.
      - { name: title, label: Title, widget: string, i18n: true, required: false, hint: "Required in English. Leave empty in German/Portuguese to show the English version." }
      - { name: venue, label: Venue, widget: string, i18n: true, required: false }
      - { name: summary, label: Summary, widget: text, i18n: true, required: false }
      - { name: ctaLabel, label: Button label, widget: string, i18n: true, required: false, hint: "e.g. Request information / Informationen anfordern / Pedir informações" }
      - { name: body, label: Details, widget: markdown, i18n: true, required: false }

  - name: documents
    label: Documents & Public Notices
    folder: "content/documents"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: category, label: Category, widget: select, options: [Public Notice, Form, Consular Document, Trade, Other] }
      - { name: file, label: PDF file, widget: file, media_library: { config: { multiple: false } } }
      - { name: description, label: Description, widget: text, required: false }

