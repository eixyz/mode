# Decap CMS configuration
# NOTE: Fill in your GitHub repo details and configure a GitHub OAuth app
# (via a Netlify-compatible OAuth provider, e.g. https://github.com/vencax/netlify-cms-github-oauth-provider
# hosted separately) then set `base_url` below. Secrets must NOT be committed.

backend:
  name: github
  repo: eixyz/mode # TODO: replace with GitHub owner/repo, e.g. mozambique-embassy/website
  branch: main
  # OAuth flow — the client_id is public, but the client_secret lives on your
  # OAuth proxy server (never in this file).
  base_url: https://sveltia-cms-auth.mozemb.workers.dev # TODO
  auth_endpoint: /auth

# Where uploaded images go in the repo, and how they're served by the site.
media_folder: "public/uploads"
public_folder: "/uploads"

# File names: plain ASCII, accents removed ("Fátima" -> "fatima"). tests/content.test.ts
# rejects other characters, and accented names break some tools and URLs.
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# Show a "Publish" workflow with drafts / review before merging.
publish_mode: editorial_workflow

site_url: https://mozambique-embassy.de # TODO: production URL
display_url: https://mozambique-embassy.de # TODO
logo_url: /brand/coat-of-arms.svg

# Local testing: run `npm run cms` next to `npm run dev`, then open
# http://localhost:8080/admin/ — edits are written to your local files and no
# GitHub sign-in is needed. Ignored on the live site.
local_backend: true

# News and events can be written in English, German and Portuguese.
# Each language is saved as its own file (slug.en.md, slug.de.md, slug.pt.md).
# English is required; an empty German or Portuguese version shows the English text.
i18n:
  structure: multiple_files
  locales: [en, de, pt]
  default_locale: en

collections:
  - name: news
    label: News & Announcements
    description: "Announcements, press releases and notices. For something that happens on a specific date and place, use Events."
    folder: "content/news"
    create: true
    i18n: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: [date, title]
    extension: md
    format: frontmatter
    fields:
      # Shared fields (no i18n) are entered once, in the English tab.
      - { name: id, label: ID (slug), widget: string, hint: "Stable web address, e.g. new-consular-hours. Lowercase letters, numbers and hyphens. Do not change after publishing." }
      - { name: date, label: Publish date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: category, label: Category, widget: select, options: [Announcement, Press Release, Consular, Cultural, Trade], hint: "For an upcoming event (date, time, venue), use the Events section instead; it appears on the Events page and the homepage." }
      - { name: image, label: Cover image, widget: image, required: false, hint: "Landscape photo, at least 1200 px wide. Only use photos the Embassy may publish." }
      - { name: featured, label: Highlight on homepage, widget: boolean, default: false, required: false, hint: "Shows this news in the slider at the top of the homepage. Untick when it is no longer current." }
      # Translatable fields. "required: false" lets you save before translating;
      # the automatic check refuses an English entry without a title.
      - { name: title, label: Title, widget: string, i18n: true, required: false, hint: "Required in English. Leave empty in German/Portuguese to show the English version." }
      - { name: displayDate, label: Display date (optional), widget: string, i18n: true, required: false, hint: "Leave empty to show the publish date automatically in each language." }
      - { name: excerpt, label: Short excerpt, widget: text, i18n: true, required: false, hint: "One or two sentences shown in the news list." }
      - { name: body, label: Body, widget: markdown, i18n: true, required: false }

  - name: events
    label: Events
    description: "Receptions, meetings, cultural evenings and other dated events. Shown on the Events page and, until the event has taken place, in the slider at the top of the homepage."
    folder: "content/events"
    create: true
    i18n: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: [date, title]
    extension: md
    format: frontmatter
    fields:
      # Shared fields (no i18n) are entered once, in the English tab.
      - { name: id, label: ID (slug), widget: string, hint: "Stable web address, e.g. independence-day-reception. Lowercase letters, numbers and hyphens." }
      - { name: date, label: Event date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: time, label: Time, widget: string, hint: "24-hour time only, e.g. 15:00 or 18:00 – 20:00. The same value is shown in every language, so do not add words." }
      - { name: published, label: Publish date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, hint: "Filled in automatically with today. Orders the homepage: the newest news or event comes first." }
      - { name: category, label: Category, widget: select, options: [Cultural, Diplomatic, Trade, Public, Commemoration] }
      - { name: featured, label: Highlight on homepage, widget: boolean, default: true, required: false, hint: "Shows the event in the slider at the top of the homepage until the event date has passed." }
      - { name: image, label: Cover image, widget: image, required: false, hint: "Landscape photo, at least 1200 px wide. Shown on the homepage, the Events page and the event page." }
      # Translatable fields.
      - { name: title, label: Title, widget: string, i18n: true, required: false, hint: "Required in English. Leave empty in German/Portuguese to show the English version." }
      - { name: venue, label: Venue, widget: string, i18n: true, required: false }
      - { name: summary, label: Summary, widget: text, i18n: true, required: false, hint: "One or two sentences shown on the homepage and the Events page." }
      - name: details
        label: Programme / key details
        label_singular: row
        widget: list
        i18n: true
        required: false
        summary: "{{fields.label}}: {{fields.value}}"
        hint: "One row per item, e.g. Date | Saturday, 21 November 2026, or 15:00 | Meeting with community leaders. Shown as a table on the event page."
        fields:
          - { name: label, label: "Label (left), e.g. Date or 15:00", widget: string }
          - { name: value, label: "Text (right)", widget: string }
      - { name: ctaLabel, label: Button label (optional), widget: string, i18n: true, required: false, hint: "Leave empty to show \"Request information\" in the visitor's language. The button opens an enquiry form." }
      - { name: body, label: Further information, widget: markdown, i18n: true, required: false }

  # Every download on Services > Forms & Documents (and the Services page) comes
  # from this list. The PDFs themselves live in public/documents.
  - name: documents
    label: Documents & Public Notices
    label_singular: document
    description: "Forms, fee tables and public notices offered for download on Services > Forms & Documents. To replace a PDF, open the entry and choose a new file. To take a document off the website, open it and choose Delete."
    folder: "content/documents"
    create: true
    delete: true
    i18n: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{category}} — {{title}}"
    sortable_fields: [date, title, category]
    view_groups:
      - { label: Category, field: category }
    extension: md
    format: frontmatter
    media_folder: "/public/documents"
    public_folder: "/documents"
    fields:
      # Shared fields (no i18n) are entered once, in the English tab.
      - { name: category, label: Category, widget: select, options: [Public Notice, Form, Visa Information, Fees & Payment, Other], hint: "Groups the downloads on the website. Public notices are listed first." }
      - { name: date, label: Date (published or last updated), widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, hint: "Within a group, the newest date comes first. Change it when you upload a new version." }
      - { name: file, label: PDF file, widget: file, media_library: { config: { multiple: false } }, hint: "Upload the PDF or choose one already uploaded. Use a short file name without accents or spaces, e.g. visa-application-form-2026.pdf." }
      # Translatable fields.
      - { name: title, label: Title, widget: string, i18n: true, required: false, hint: "Required in English. Leave empty in German/Portuguese to show the English version. Mention the document's language if it matters, e.g. Fee Schedule (Portuguese)." }
      - { name: description, label: Description, widget: text, i18n: true, required: false, hint: "One sentence shown under the title." }

